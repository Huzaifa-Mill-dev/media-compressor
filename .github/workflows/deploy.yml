name: Test and deploy to AWS EC2

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
            web/package-lock.json
      - name: Install native tools used by the server tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ghostscript qpdf libreoffice-writer libreoffice-calc python3-fonttools python3-brotli fonts-dejavu fonts-liberation util-linux
      - name: Install pdf2docx (pdf-to-docx tool)
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/mt-python"
          "$RUNNER_TEMP/mt-python/bin/pip" install -r server/scripts/requirements-pdf2docx.txt
          echo "PYTHON=$RUNNER_TEMP/mt-python/bin/python" >> "$GITHUB_ENV"
      - name: Allow unprivileged user namespaces (LibreOffice network isolation uses unshare -rn)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci && npm --prefix engine ci && npm --prefix web ci
      - name: Typecheck (server + engine)
        run: npm run typecheck && npm --prefix engine run typecheck
      - name: Engine unit tests
        run: npm --prefix engine run test:unit
      - name: Server tests (real binaries)
        run: npm test -- --reporter=default --reporter=github-actions
      - name: Build site and server
        run: npm run build
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Full-stack E2E (real server + built site)
        run: npm --prefix web run test:e2e

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
            web/package-lock.json
      - run: npm ci && npm --prefix engine ci && npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Astro check
        run: npm --prefix web run check
      - name: Engine browser tests (real codecs in Chromium)
        run: npm --prefix engine run test:browser
      - name: Web Playwright tests
        run: npm --prefix web test

  deploy:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Build here, not on the 1 GB box: the box only unpacks the result and installs the server's
      # five production dependencies (no engine/web installs, no Astro build, no swap thrashing).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
            web/package-lock.json
      - run: npm ci && npm --prefix engine ci && npm --prefix web ci
      - run: npm run build
      - name: Package the build
        run: tar -czf build.tgz web/dist server/dist
      - name: Copy the build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build.tgz
          target: /tmp/media-compressor-build
      - name: Install and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/media-compressor
            # The box is a deploy target, not a dev checkout: take exactly the commit that was built
            # (server/scripts, shared/, ecosystem.config.cjs come from git; the dists from CI).
            git fetch origin main
            git reset --hard ${{ github.sha }}
            rm -rf web/dist server/dist
            tar -xzf /tmp/media-compressor-build/build.tgz
            rm -rf /tmp/media-compressor-build
            npm ci --omit=dev
            # Start from ecosystem.config.cjs: a plain "pm2 restart" would reuse the old saved command (node server.js).
            pm2 delete media-compressor >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs
            pm2 save
